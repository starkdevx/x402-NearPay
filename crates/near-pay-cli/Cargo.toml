[package]
name = "near-pay"
version = "1.0.0"
edition = "2021"
description = "NEAR Pay — Rust CLI for autonomous AI agent payments via NEAR Intents"
authors = ["NEAR Pay Team"]
license = "Apache-2.0"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
colored = "2.1"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4"] }

